[package]
name = "ccc-harness"
version = "0.3.0"
edition = "2021"
description = "Dispatches agent types to Claude Code or Codex subprocesses"
license = "Apache-2.0"
repository = "https://github.com/rnortman/ccc"
readme = "README.md"
keywords = ["claude", "codex", "agents", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    ".claude/",
    ".githooks/",
    ".github/",
    ".gitleaks.toml",
    ".gitignore",
    "CLAUDE.md",
    "AGENTS.md",
    "Makefile",
]

[[bin]]
name = "ccc"
path = "src/main.rs"

[dependencies]
anyhow = "1"
claude-usage-mqtt-client = "0.2.1"
claude-usage-mqtt-core = "0.2.1"
clap = { version = "4", features = ["derive"] }
jiff = { version = "0.2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt", "time"] }
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
